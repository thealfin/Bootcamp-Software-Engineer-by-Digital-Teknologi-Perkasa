<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Digitek Bootcamp" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Digitek Bootcamp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B1E"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="12%" cy="92%" r="70%">
      <stop offset="0" stop-color="#16314F" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#16314F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="92%" cy="8%" r="70%">
      <stop offset="0" stop-color="#4A2A1A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4A2A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7F2E"/>
      <stop offset="1" stop-color="#F2500F"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBEBEE"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52B6FF"/>
      <stop offset="1" stop-color="#1E88FF"/>
    </linearGradient>
  </defs>

  <!-- Latar -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glowBlue)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glowOrange)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Icon (sudah di-center-kan) -->
  <g transform="translate(-2.5 1)">
    <!-- Tanda seru: batang + titik biru -->
    <rect x="128" y="133" width="44" height="173" rx="22" fill="url(#white)"/>
    <circle cx="150" cy="355" r="22" fill="url(#blue)"/>

    <!-- Chevron oranye -->
    <path d="M214 158 L366 255 L214 352" fill="none" stroke="url(#orange)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Garis miring kecil -->
    <line x1="233" y1="283" x2="267" y2="227" stroke="#E4E4E7" stroke-width="14" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
